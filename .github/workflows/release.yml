# Builds the AlbumMix plugin zip, attaches it to the GitHub release,
# checks the download works, and only then updates repo.xml.
#
# Which repository file is updated depends on where the tagged commit is:
#   on main     -> normal release, repo.xml
#                  (what everyone using the normal repository URL gets)
#   on Testing  -> pre-release, repo-testing.xml
#                  (only servers using the testing repository URL get it)
# Both files live on main, so merging Testing into main never carries a
# test version into repo.xml.
#
# Promoting a tested version: merge Testing into main and push, then run
# this workflow (Run workflow) for the same tag. It reuses the zip that was
# already tested, so the SHA stays the same, clears the pre-release flag
# and updates repo.xml.
#
# Normal use:   bump <version> in install.xml, commit, push, then
#               git tag v1.2.0 && git push origin v1.2.0
# Rebuild/fix:  Actions tab > Release > Run workflow > enter an existing tag

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.1.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      TEST_BRANCH: Testing
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check tag matches install.xml version
        run: |
          VERSION="${TAG#v}"
          INSTALL_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' install.xml | head -1)
          echo "Tag: $TAG  install.xml: $INSTALL_VERSION"
          if [ "$VERSION" != "$INSTALL_VERSION" ]; then
            echo "::error::Tag $TAG does not match install.xml version $INSTALL_VERSION. Bump install.xml before tagging."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIPFILE=AlbumMix-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Work out whether this is a main or a Testing release
        run: |
          COMMIT=$(git rev-list -n 1 "$TAG")
          git fetch origin main "$TEST_BRANCH" || git fetch origin main
          if git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "REPO_FILE=repo.xml" >> "$GITHUB_ENV"
            echo "PRERELEASE=" >> "$GITHUB_ENV"
            echo "$TAG is on main: normal release"
          elif git rev-parse --verify -q "origin/$TEST_BRANCH" >/dev/null \
               && git merge-base --is-ancestor "$COMMIT" "origin/$TEST_BRANCH"; then
            echo "REPO_FILE=repo-testing.xml" >> "$GITHUB_ENV"
            echo "PRERELEASE=1" >> "$GITHUB_ENV"
            echo "$TAG is on $TEST_BRANCH: pre-release"
          else
            echo "::error::Tag $TAG is not on main or $TEST_BRANCH. Push the branch before the tag."
            exit 1
          fi

      - name: Build plugin zip (AlbumMix/ folder at the top)
        run: |
          mkdir -p build/AlbumMix
          # every Perl module (Plugin.pm, Settings.pm, PlayerSettings.pm, ...)
          cp *.pm install.xml strings.txt LICENSE build/AlbumMix/
          cp -r HTML build/AlbumMix/
          (cd build && zip -rX "../$ZIPFILE" AlbumMix)
          # (the variable is ZIPFILE, not ZIP: zip reads $ZIP as extra options)
          unzip -l "$ZIPFILE" | tee zip-contents.txt
          grep -q ' AlbumMix/install.xml$' zip-contents.txt || { echo "::error::Zip layout is wrong"; exit 1; }
          for f in *.pm; do
            grep -q " AlbumMix/$f\$" zip-contents.txt || { echo "::error::$f is missing from the zip"; exit 1; }
          done
          SHA=$(sha1sum "$ZIPFILE" | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "SHA1: $SHA"

      - name: Attach zip to the GitHub release
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "$ZIPFILE"; then
              # Already published: keep that exact zip (and its SHA) rather
              # than replacing it with a rebuild that would have a new SHA
              echo "$ZIPFILE is already on the release; reusing it"
              echo "REUSED=1" >> "$GITHUB_ENV"
            else
              gh release upload "$TAG" "$ZIPFILE" --repo "$REPO"
            fi
            if [ -z "$PRERELEASE" ] && [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
              echo "Promoting $TAG from pre-release to a normal release"
              gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest --title "$TAG"
            fi
          else
            if [ -n "$PRERELEASE" ]; then
              gh release create "$TAG" "$ZIPFILE" --repo "$REPO" --title "$TAG (testing)" --generate-notes --prerelease
            else
              gh release create "$TAG" "$ZIPFILE" --repo "$REPO" --title "$TAG" --generate-notes --latest
            fi
          fi

      - name: Check the download URL works and the SHA matches
        run: |
          URL="https://github.com/$REPO/releases/download/$TAG/$ZIPFILE"
          echo "URL=$URL" >> "$GITHUB_ENV"
          for i in 1 2 3 4 5 6; do
            curl -fsSL -o check.zip "$URL" && break
            echo "Not available yet, retrying in 10s..."
            sleep 10
          done
          GOT=$(sha1sum check.zip | cut -d' ' -f1)
          if [ -n "$REUSED" ]; then
            echo "SHA=$GOT" >> "$GITHUB_ENV"
            echo "Using the published zip's SHA1: $GOT"
          elif [ "$GOT" != "$SHA" ]; then
            echo "::error::Downloaded zip SHA $GOT does not match built SHA $SHA"
            exit 1
          fi
          echo "Download OK, SHA matches."

      - name: Update repo.xml or repo-testing.xml on main (only after the zip is live)
        run: |
          git fetch origin main
          git checkout -B main origin/main

          # First testing release: start repo-testing.xml from repo.xml
          if [ ! -f "$REPO_FILE" ]; then
            sed 's/plugin repository</plugin repository (testing)</' repo.xml > "$REPO_FILE"
            git add "$REPO_FILE"
          fi

          CURRENT=$(sed -n 's:.*<plugin name="AlbumMix" version="\([^"]*\)".*:\1:p' "$REPO_FILE" | head -1)
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)
          if [ "$CURRENT" != "$VERSION" ] && [ "$NEWEST" = "$CURRENT" ]; then
            echo "$REPO_FILE already advertises newer version $CURRENT; not downgrading to $VERSION."
            exit 0
          fi

          sed -i -E \
            -e "s|(<plugin name=\"AlbumMix\" version=\")[^\"]*|\1$VERSION|" \
            -e "s|<url>[^<]*</url>|<url>$URL</url>|" \
            -e "s|<sha>[^<]*</sha>|<sha>$SHA</sha>|" \
            "$REPO_FILE"
          git add "$REPO_FILE"
          git diff --cached "$REPO_FILE"

          if git diff --cached --quiet; then
            echo "$REPO_FILE already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$REPO_FILE: publish $TAG (sha1 $SHA)"
          git push origin main
